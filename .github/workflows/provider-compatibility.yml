name: OCI 9 compatibility
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        root: ["examples/01_single_instance", "examples/02_instance_pool_autoscaling", "examples/03_instance_pool_scheduled_autoscaling", "examples/04_instance_pool_with_load_balancer", "examples/05_multiple_instances_with_load_balancer", "."]
    env:
      TF_IN_AUTOMATION: "1"
      TF_INPUT: "0"
      OCI9_ALLOW_UNRELEASED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.11.6
          tofu_wrapper: false
      - name: Format, initialize, validate and mocked plan
        run: python3 scripts/oci9_check.py --root '${{ matrix.root }}'
